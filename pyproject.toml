[project]
name = "classification"
version = "0.1.0"
description = "A sample font glyph classification project using TorchFont"
readme = "README.md"
authors = [{ name = "fjktkm", email = "fjktkm@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "lightning>=2.6.1",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "torch>=2.10.0",
    "torchfont>=0.11.0",
    "transformers>=5.1.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.15.0", "ty>=0.0.15"]

[tool.ty.rules]
possibly-missing-attribute = "ignore"

[tool.ruff.lint]
ignore = ["PLR0913"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
